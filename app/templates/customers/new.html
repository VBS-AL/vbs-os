{% extends "base.html" %}
{% block title %}New Customer — Van Buren Steel{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/customers" class="text-gray-400 hover:text-steel-mid text-sm">← Customers</a>
    <h1 class="text-2xl font-bold text-steel-dark">New Customer</h1>
  </div>
  {% if error %}<div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm">{{ error }}</div>{% endif %}

  <form method="POST" action="/customers/new" class="bg-white rounded-xl shadow p-6 space-y-4">
    <input type="hidden" name="next" value="{{ next }}"/>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
      <input type="text" name="name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Company</label>
      <input type="text" name="company" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input type="tel" name="phone" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
      <input type="text" name="address" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
      <textarea name="notes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
    </div>
    <div class="flex justify-end gap-3 pt-2">
      <a href="{{ next }}" class="px-5 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm hover:bg-gray-50">Cancel</a>
      <button type="submit" class="bg-steel-dark hover:bg-steel-mid text-white text-sm font-medium px-6 py-2 rounded-lg transition">Save Customer</button>
    </div>
  </form>
</div>
{% endblock %}

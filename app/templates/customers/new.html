{% extends "base.html" %}
{% block title %}New Customer — Van Buren Steel{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/customers" class="text-gray-400 hover:text-steel-mid text-sm">← Customers</a>
    <h1 class="text-2xl font-bold text-steel-dark">New Customer</h1>
  </div>
  {% if error %}<div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm">{{ error }}</div>{% endif %}

  <form method="POST" action="/customers/new" class="bg-white rounded-xl shadow p-6 space-y-4">
    <input type="hidden" name="next" value="{{ next }}"/>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Name <span class="text-red-500">*</span></label>
      <input type="text" name="name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none"/>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Company</label>
      <input type="text" name="company" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
        <input type="tel" name="phone" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Street Address</label>
      <input type="text" name="address_line1" required placeholder="123 Main St" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
    </div>
    <div class="grid grid-cols-5 gap-3">
      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
        <input type="text" name="city" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">State/Prov</label>
        <input type="text" name="state" required maxlength="3" placeholder="ON" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm uppercase"/>
      </div>
      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Postal Code</label>
        <input type="text" name="zip_code" required placeholder="A1B 2C3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Default Payment Terms</label>
      <select name="payment_terms" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
        <option value="0" selected>Due on Receipt</option>
        <option value="3">Net 3</option>
        <option value="7">Net 7</option>
        <option value="15">Net 15</option>
        <option value="30">Net 30</option>
        <option value="45">Net 45</option>
        <option value="60">Net 60</option>
        <option value="90">Net 90</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">Notes</label>
      <textarea name="notes" rows="3" placeholder="Internal notes..."
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid"></textarea>
    </div>

    <div class="pt-2 border-t border-gray-100">
      <p class="text-xs font-semibold text-steel-dark uppercase tracking-wide mb-3">💳 Accounting / AR Contact</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contact Name</label>
          <input type="text" name="ar_contact_name" placeholder="e.g. Jane Smith"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
          <input type="text" name="ar_contact_title" placeholder="e.g. Accounts Payable"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
          <input type="tel" name="ar_contact_phone"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="ar_contact_email"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
        </div>
      </div>
    </div>

    <div class="pt-2">
      <button type="submit"
        class="w-full bg-steel-dark text-white font-medium py-2 rounded-lg hover:bg-steel-mid transition text-sm">
        Create Customer
      </button>
    </div>
  </form>
</div>
{% endblock %}

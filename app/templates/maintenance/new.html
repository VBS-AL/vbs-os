{% extends "base.html" %}
{% block title %}New PM Task — Van Buren Steel{% endblock %}
{% block content %}

<div class="mb-6">
  <h1 class="text-2xl font-bold text-steel-dark">Add Maintenance Task</h1>
</div>

<form method="post" action="/maintenance/new" class="max-w-2xl space-y-6">
  <div class="bg-white rounded-xl shadow p-6 space-y-4">

    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Task Name <span class="text-red-400">*</span></label>
      <input type="text" name="name" required placeholder="e.g. Oil Change — Truck 1"
             class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Equipment Type <span class="text-red-400">*</span></label>
        <select name="equipment_type" required id="equip-type" onchange="onEquipChange()"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid">
          <option value="">— Select —</option>
          {% for e in equipment_types %}
          <option value="{{ e.value }}">{{ equipment_labels.get(e, e.value) }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Specific Unit</label>
        <input type="text" name="equipment_label" placeholder="e.g. Truck 1, Hi-Lo 2"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Frequency <span class="text-red-400">*</span></label>
        <select name="frequency" required id="freq-type" onchange="onFreqChange()"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid">
          <option value="">— Select —</option>
          {% for f in freq_types %}
          <option value="{{ f.value }}">{{ freq_labels.get(f, f.value) }}</option>
          {% endfor %}
        </select>
      </div>
      <div id="mileage-interval-wrap" class="hidden">
        <label class="block text-xs font-medium text-gray-600 mb-1">Miles Between Service</label>
        <input type="number" name="mileage_interval" step="500" min="0" placeholder="e.g. 5000"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid">
      </div>
      <div id="next-due-wrap">
        <label class="block text-xs font-medium text-gray-600 mb-1">Next Due Date</label>
        <input type="date" name="next_due_date"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid">
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Notes</label>
      <textarea name="notes" rows="2" placeholder="Any special instructions…"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid"></textarea>
    </div>
  </div>

  <div class="flex gap-3">
    <button type="submit" class="bg-steel-dark text-white px-6 py-2 rounded-lg hover:bg-steel-mid transition text-sm font-medium">Save Task</button>
    <a href="/maintenance" class="px-6 py-2 rounded-lg border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 transition">Cancel</a>
  </div>
</form>

<script>
function onFreqChange() {
  const freq = document.getElementById('freq-type').value;
  const mileWrap = document.getElementById('mileage-interval-wrap');
  const dateWrap = document.getElementById('next-due-wrap');
  if (freq === 'mileage') {
    mileWrap.classList.remove('hidden');
    dateWrap.classList.add('hidden');
  } else {
    mileWrap.classList.add('hidden');
    dateWrap.classList.remove('hidden');
  }
}
function onEquipChange() {}
</script>
{% endblock %}

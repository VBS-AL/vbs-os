{% extends "base.html" %}
{% block title %}New Order — Van Buren Steel{% endblock %}
{% block content %}

<div class="max-w-4xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/orders" class="text-gray-400 hover:text-steel-mid text-sm">← Orders</a>
    <h1 class="text-2xl font-bold text-steel-dark">New Order</h1>
  </div>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/orders/new" id="order-form">

    <!-- Customer & Type -->
    <div class="bg-white rounded-xl shadow p-6 mb-4">
      <h2 class="text-sm font-semibold text-steel-dark uppercase tracking-wide mb-4">Customer & Job Info</h2>
      <div class="grid grid-cols-2 gap-4">

        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Customer <span class="text-red-500">*</span></label>
          <input id="customer-search" name="_customer_search" placeholder="Search by name or phone…"
            hx-get="/orders/search/customers" hx-trigger="keyup changed delay:300ms" hx-target="#customer-results"
            hx-include="this" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none" autocomplete="off"/>
          <input type="hidden" name="customer_id" id="customer-id" required/>
          <div id="customer-selected" class="mt-1 text-sm text-steel-mid font-medium hidden"></div>
          <div id="customer-results" class="border border-gray-200 rounded-lg mt-1 divide-y divide-gray-100 text-sm hidden shadow-sm"></div>
          <div class="mt-2">
            <a href="/customers/new?next=/orders/new" class="text-xs text-steel-mid hover:underline">+ New customer</a>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Job Type <span class="text-red-500">*</span></label>
          <select name="job_type" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            {% for j in job_types %}
            <option value="{{ j.value }}">{{ j.value.replace('_',' ').title() }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
          <select name="priority" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            {% for p in priorities %}
            <option value="{{ p.value }}" {% if p.value == 'standard' %}selected{% endif %}>{{ p.value.title() }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Promised Date <span class="text-red-500">*</span></label>
          <input type="date" name="promised_date" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">PO # (customer's)</label>
          <input type="text" name="customer_po" placeholder="Optional" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
        </div>

        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Job Description / Notes</label>
          <textarea name="notes" rows="2" placeholder="Brief description of scope…" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>

        <div class="flex items-center gap-6">
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input type="checkbox" name="drawings_required" value="1" class="rounded border-gray-300 text-steel-mid"/>
            Drawings Required
          </label>
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input type="checkbox" name="material_supplied_by_customer" value="1" class="rounded border-gray-300 text-steel-mid"/>
            Customer Supplies Material
          </label>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Paint Spec (job-level)</label>
          <select name="paint_spec" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            <option value="">— Select —</option>
            <option value="Galvanized">Galvanized</option>
            <option value="Yellow Oxide">Yellow Oxide</option>
            <option value="Red Oxide">Red Oxide</option>
            <option value="Black">Black</option>
            <option value="Grey">Grey</option>
            <option value="Powder Coat">Powder Coat</option>
            <option value="No Paint">No Paint</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Line Items -->
    <div class="bg-white rounded-xl shadow p-6 mb-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-steel-dark uppercase tracking-wide">Line Items</h2>
        <button type="button" onclick="addLine()" class="text-sm text-steel-mid hover:text-steel-dark font-medium">+ Add Line</button>
      </div>
      <div id="lines-container" class="space-y-3"></div>
      <p id="no-lines" class="text-sm text-gray-400 text-center py-4">No line items yet. Click "Add Line".</p>
    </div>

    <!-- Delivery Surcharge -->
    <div class="bg-white rounded-xl shadow p-5">
      <h2 class="text-xs font-semibold text-steel-dark uppercase tracking-wide mb-3">Delivery</h2>
      <div class="flex items-center gap-4">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="surcharge-toggle" onchange="toggleSurcharge(this)"
            class="rounded border-gray-300 text-steel-mid w-4 h-4"/>
          <span class="text-sm text-gray-700">Add delivery charge</span>
        </label>
        <div id="surcharge-amount-wrap" class="hidden flex items-center gap-2">
          <span class="text-sm text-gray-500">$</span>
          <input type="number" name="delivery_surcharge" id="surcharge-amount"
            min="0" step="0.01" placeholder="75.00"
            class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm w-28 focus:outline-none focus:ring-2 focus:ring-steel-mid"/>
        </div>
      </div>
    </div>

    <div class="flex justify-end gap-3">
      <a href="/orders" class="px-5 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm hover:bg-gray-50 transition">Cancel</a>
      <button type="submit" class="bg-steel-dark hover:bg-steel-mid text-white text-sm font-medium px-6 py-2 rounded-lg transition">Create Order</button>
    </div>

  </form>
</div>

<script>
function toggleSurcharge(cb) {
  document.getElementById('surcharge-amount-wrap').classList.toggle('hidden', !cb.checked);
  if (cb.checked) {
    const inp = document.getElementById('surcharge-amount');
    if (!inp.value) inp.value = '75.00';
    inp.focus();
  }
}

let lineCount = 0;

function addLine() {
  const idx = lineCount++;
  const row = document.createElement('div');
  row.className = 'line-item bg-gray-50 rounded-lg p-3 space-y-2';
  row.innerHTML = `
    <!-- Inventory search row -->
    <div class="relative">
      <label class="block text-xs text-gray-500 mb-1">Search Inventory <span class="text-gray-400">(optional — type SKU or name)</span></label>
      <input type="text" id="inv-search-${idx}" name="q" placeholder="Type to search inventory…" autocomplete="off"
        hx-get="/inventory/search" hx-trigger="keyup changed delay:250ms" hx-target="#inv-results-${idx}"
        hx-include="this"
        class="w-full border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none"/>
      <input type="hidden" name="li_inv_id_${idx}" id="li-inv-id-${idx}"/>
      <div id="inv-results-${idx}" class="absolute z-10 w-full bg-white border border-gray-200 rounded-lg shadow-lg mt-0.5 divide-y divide-gray-100 hidden max-h-48 overflow-y-auto"></div>
      <span id="inv-badge-${idx}" class="hidden mt-1 inline-flex items-center gap-1 text-xs bg-blue-50 text-blue-700 border border-blue-200 rounded px-2 py-0.5">
        <span id="inv-badge-text-${idx}"></span>
        <button type="button" onclick="clearInv(${idx})" class="text-blue-400 hover:text-blue-600 ml-1">×</button>
      </span>
    </div>
    <!-- Line fields -->
    <div class="grid grid-cols-12 gap-2 items-start">
      <div class="col-span-3">
        <label class="block text-xs text-gray-500 mb-1">Description</label>
        <input type="text" name="li_desc_${idx}" id="li-desc-${idx}" required placeholder="Item description…"
          class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm"/>
      </div>
      <div class="col-span-1">
        <label class="block text-xs text-gray-500 mb-1">Qty</label>
        <input type="number" name="li_qty_${idx}" min="0.01" step="0.01" value="1" required
          class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm"/>
      </div>
      <div class="col-span-2">
        <label class="block text-xs text-gray-500 mb-1">Unit Price ($)</label>
        <input type="number" name="li_price_${idx}" id="li-price-${idx}" step="1" min="0" placeholder="0.00"
          class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm"/>
      </div>
      <div class="col-span-2">
        <label class="block text-xs text-gray-500 mb-1">Paint Override</label>
        <select name="li_paint_${idx}" class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm">
          <option value="">Same as job</option>
          <option value="Galvanized">Galvanized</option>
          <option value="Yellow Oxide">Yellow Oxide</option>
          <option value="Red Oxide">Red Oxide</option>
          <option value="Black">Black</option>
          <option value="Grey">Grey</option>
          <option value="Powder Coat">Powder Coat</option>
          <option value="No Paint">No Paint</option>
        </select>
      </div>
      <div class="col-span-1">
        <label class="block text-xs text-gray-500 mb-1">Labor hrs <span class="text-red-400">*</span></label>
        <input type="number" name="li_labor_${idx}" id="li-labor-${idx}" step="0.25" min="0.25" placeholder="0"
          oninput="updateLaborCost(${idx})"
          class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm"/>
      </div>
      <div class="col-span-2">
        <label class="block text-xs text-gray-500 mb-1">Labor Dept <span class="text-red-400">*</span></label>
        <select name="li_labor_dept_${idx}" id="li-labor-dept-${idx}" onchange="updateLaborCost(${idx})"
          class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm">
          <option value="">— Select Dept —</option>
          <option value="general_labor">General Labor ($80/hr)</option>
          <option value="steel_fabrication">Steel Fab ($100/hr)</option>
          <option value="aluminum_structural">Aluminum ($120/hr)</option>
        </select>
        <p id="labor-cost-${idx}" class="text-xs font-semibold text-indigo-600 mt-1 h-4"></p>
      </div>
      <div class="col-span-1 flex justify-end pt-5">
        <button type="button" onclick="this.closest('.line-item').remove(); updateNoLines()"
          class="text-red-400 hover:text-red-600 text-lg leading-none">×</button>
      </div>
    </div>`;

  document.getElementById('lines-container').appendChild(row);
  updateNoLines();

  // Register HTMX on the new row so the inventory search fires
  htmx.process(row);

  // Wire the search input to include its own value
  const searchEl = document.getElementById(`inv-search-${idx}`);
  searchEl.addEventListener('keyup', function() {
    const resultsEl = document.getElementById(`inv-results-${idx}`);
    resultsEl.classList.toggle('hidden', !this.value.trim());
  });
}

function updateNoLines() {
  const count = document.querySelectorAll('.line-item').length;
  document.getElementById('no-lines').style.display = count ? 'none' : 'block';
}

const LABOR_RATES = { general_labor: 80, steel_fabrication: 100, aluminum_structural: 120 };

function updateLaborCost(idx) {
  const hrs  = parseFloat(document.getElementById(`li-labor-${idx}`)?.value || 0);
  const dept = document.getElementById(`li-labor-dept-${idx}`)?.value;
  const el   = document.getElementById(`labor-cost-${idx}`);
  if (!el) return;
  el.textContent = (hrs > 0 && dept && LABOR_RATES[dept])
    ? `Est. labor: $${(hrs * LABOR_RATES[dept]).toFixed(0)}`
    : '';
}

function clearInv(idx) {
  document.getElementById(`li-inv-id-${idx}`).value = '';
  document.getElementById(`inv-search-${idx}`).value = '';
  document.getElementById(`inv-badge-${idx}`).classList.add('hidden');
}

// Global click handler for inventory results (works on dynamically added rows)
document.addEventListener('click', function(e) {
  const item = e.target.closest('[data-inv-id]');
  if (item) {
    // Find which row this belongs to
    const resultsDiv = item.closest('[id^="inv-results-"]');
    if (!resultsDiv) return;
    const idx = resultsDiv.id.replace('inv-results-', '');

    // Fill fields
    document.getElementById(`li-inv-id-${idx}`).value  = item.dataset.invId;
    document.getElementById(`li-desc-${idx}`).value    = item.dataset.invName;
    if (item.dataset.invPrice) {
      // data-inv-price is already sell price (cost × markup) from the server
      document.getElementById(`li-price-${idx}`).value = parseFloat(item.dataset.invPrice).toFixed(2);
    }

    // Show badge
    document.getElementById(`inv-badge-text-${idx}`).textContent =
      (item.dataset.invSku ? item.dataset.invSku + ' · ' : '') + item.dataset.invName;
    document.getElementById(`inv-badge-${idx}`).classList.remove('hidden');

    // Clear search + hide results
    document.getElementById(`inv-search-${idx}`).value = '';
    resultsDiv.innerHTML = '';
    resultsDiv.classList.add('hidden');
    return;
  }

  // Close any open inventory dropdowns if clicking outside
  document.querySelectorAll('[id^="inv-results-"]').forEach(el => {
    if (!el.contains(e.target)) {
      el.classList.add('hidden');
    }
  });
});

// HTMX: show results div after swap
document.addEventListener('htmx:afterSwap', function(e) {
  if (e.target.id === 'customer-results') {
    e.target.classList.remove('hidden');
  }
  if (e.target.id && e.target.id.startsWith('inv-results-')) {
    if (e.target.innerHTML.trim()) e.target.classList.remove('hidden');
    else e.target.classList.add('hidden');
  }
});

// Customer autocomplete
document.getElementById('customer-results').addEventListener('click', function(e) {
  const el = e.target.closest('[data-customer-id]');
  if (!el) return;
  document.getElementById('customer-id').value = el.dataset.customerId;
  document.getElementById('customer-search').value = el.dataset.customerName;
  const sel = document.getElementById('customer-selected');
  sel.textContent = '✓ ' + el.dataset.customerName;
  sel.classList.remove('hidden');
  this.innerHTML = '';
  this.classList.add('hidden');
});

document.getElementById('order-form').addEventListener('submit', function(e) {
  if (!document.getElementById('customer-id').value) {
    e.preventDefault();
    alert('Please select a customer from the search results.');
    document.getElementById('customer-search').focus();
    return;
  }
  const lines = document.querySelectorAll('.line-item');
  if (lines.length === 0) {
    e.preventDefault();
    alert('Add at least one line item before saving.');
    return;
  }
  for (let i = 0; i < lines.length; i++) {
    const hrsInput   = lines[i].querySelector('input[name^="li_labor_"]');
    const deptSelect = lines[i].querySelector('select[name^="li_labor_dept_"]');
    const hrs = parseFloat(hrsInput?.value);
    if (!hrsInput || !(hrs > 0)) {
      e.preventDefault();
      hrsInput.classList.add('border-red-500');
      hrsInput.focus();
      alert(`Line item ${i + 1}: Labor hours are required.`);
      return;
    }
    if (!deptSelect || !deptSelect.value) {
      e.preventDefault();
      deptSelect.classList.add('border-red-500');
      deptSelect.focus();
      alert(`Line item ${i + 1}: Labor department is required.`);
      return;
    }
  }
});
</script>
{% endblock %}

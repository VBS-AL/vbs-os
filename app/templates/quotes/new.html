{% extends "base.html" %}
{% block title %}New Quote — Van Buren Steel{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/quotes" class="text-gray-400 hover:text-steel-mid text-sm">← Quotes</a>
    <h1 class="text-2xl font-bold text-steel-dark">New Quote</h1>
  </div>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/quotes/new" id="quote-form">
    <div class="bg-white rounded-xl shadow p-6 mb-4">
      <h2 class="text-sm font-semibold text-steel-dark uppercase tracking-wide mb-4">Customer & Job Info</h2>
      <div class="grid grid-cols-2 gap-4">

        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Customer <span class="text-red-500">*</span></label>
          <input id="customer-search" name="_customer_search" placeholder="Search by name or phone…"
            hx-get="/quotes/search/customers" hx-trigger="keyup changed delay:300ms" hx-target="#customer-results"
            hx-include="this" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none" autocomplete="off"/>
          <input type="hidden" name="customer_id" id="customer-id"/>
          <div id="customer-selected" class="mt-1 text-sm text-steel-mid font-medium hidden"></div>
          <div id="customer-results" class="border border-gray-200 rounded-lg mt-1 divide-y divide-gray-100 text-sm hidden shadow-sm"></div>
          <div class="mt-2">
            <a href="/customers/new?next=/quotes/new" class="text-xs text-steel-mid hover:underline">+ New customer</a>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Job Type <span class="text-red-500">*</span></label>
          <select name="job_type" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            {% for j in job_types %}
            <option value="{{ j.value }}">{{ j.value.replace('_',' ').title() }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
          <select name="priority" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            {% for p in priorities %}
            <option value="{{ p.value }}" {% if p.value == 'standard' %}selected{% endif %}>{{ p.value.title() }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Paint Spec (job-level)</label>
          <select name="paint_spec" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            <option value="" disabled selected>— Select —</option>
            {% for p in paint_options %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="flex items-center gap-6 pt-5">
          <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
            <input type="checkbox" name="drawings_required" value="1" class="rounded border-gray-300"/>
            Drawings Required
          </label>
        </div>

        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Description / Scope</label>
          <textarea name="description" rows="2" required placeholder="Brief scope of work…" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>
        <div class="col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Internal Notes</label>
          <textarea name="notes" rows="2" placeholder="Notes for internal use only…" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>
      </div>
    </div>

    <!-- Line Items -->
    <div class="bg-white rounded-xl shadow p-6 mb-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-steel-dark uppercase tracking-wide">Line Items</h2>
        <button type="button" onclick="addLine()" class="text-sm text-steel-mid hover:text-steel-dark font-medium">+ Add Line</button>
      </div>
      <div id="lines-container" class="space-y-3"></div>
      <p id="no-lines" class="text-sm text-gray-400 text-center py-4">No line items yet. Click "Add Line".</p>
    </div>

    <div class="flex justify-end gap-3">
      <a href="/quotes" class="px-5 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm hover:bg-gray-50">Cancel</a>
      <button type="submit" class="bg-steel-dark hover:bg-steel-mid text-white text-sm font-medium px-6 py-2 rounded-lg transition">Save Quote</button>
    </div>
  </form>
</div>

<script>
let lineCount = 0;
const paintOptions = {{ paint_options | tojson }};

function addLine() {
  const idx = lineCount++;
  const opts = paintOptions.map(p => `<option value="${p}">${p}</option>`).join('');
  const row = document.createElement('div');
  row.className = 'line-item grid grid-cols-12 gap-2 items-end bg-gray-50 rounded-lg p-3';
  row.innerHTML = `
    <div class="col-span-4">
      <label class="block text-xs text-gray-500 mb-1">Description <span class="text-red-400">*</span></label>
      <input type="text" name="li_desc_${idx}" required placeholder="Item description…"
        class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm"/>
    </div>
    <div class="col-span-1">
      <label class="block text-xs text-gray-500 mb-1">Qty</label>
      <input type="number" name="li_qty_${idx}" min="1" value="1" required
        class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm"/>
    </div>
    <div class="col-span-2">
      <label class="block text-xs text-gray-500 mb-1">Unit Price ($)</label>
      <input type="number" name="li_price_${idx}" step="1" min="0" placeholder="0.00"
        class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm"/>
    </div>
    <div class="col-span-2">
      <label class="block text-xs text-gray-500 mb-1">Paint Spec <span class="text-red-400">*</span></label>
      <select name="li_paint_${idx}" class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm">
        <option value="Same as Job">Same as Job</option>
        ${opts}
      </select>
    </div>
    <div class="col-span-2">
      <label class="block text-xs text-gray-500 mb-1">Est. Labor hrs</label>
      <input type="number" name="li_labor_${idx}" step="0.25" min="0" placeholder="0"
        class="w-full border border-gray-300 rounded-md px-2 py-1.5 text-sm"/>
    </div>
    <div class="col-span-1 flex justify-end">
      <button type="button" onclick="this.closest('.line-item').remove(); updateNoLines()"
        class="text-red-400 hover:text-red-600 text-lg leading-none">×</button>
    </div>`;
  document.getElementById('lines-container').appendChild(row);
  updateNoLines();
}

function updateNoLines() {
  document.getElementById('no-lines').style.display =
    document.querySelectorAll('.line-item').length ? 'none' : 'block';
}

document.getElementById('customer-results').addEventListener('click', function(e) {
  const el = e.target.closest('[data-customer-id]');
  if (!el) return;
  document.getElementById('customer-id').value = el.dataset.customerId;
  document.getElementById('customer-search').value = el.dataset.customerName;
  const sel = document.getElementById('customer-selected');
  sel.textContent = '✓ ' + el.dataset.customerName;
  sel.classList.remove('hidden');
  this.innerHTML = '';
  this.classList.add('hidden');
});

document.addEventListener('htmx:afterSwap', function(e) {
  if (e.target.id === 'customer-results') e.target.classList.remove('hidden');
});

document.getElementById('quote-form').addEventListener('submit', function(e) {
  if (!document.getElementById('customer-id').value) {
    e.preventDefault();
    alert('Please select a customer from the search dropdown.');
    document.getElementById('customer-search').focus();
  }
});
</script>
{% endblock %}

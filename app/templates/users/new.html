{% extends "base.html" %}
{% block title %}New User — Van Buren Steel{% endblock %}
{% block content %}

<div class="max-w-xl mx-auto">
  <div class="flex items-center gap-3 mb-6">
    <a href="/users" class="text-gray-400 hover:text-steel-mid text-sm">← Team</a>
    <h1 class="text-2xl font-bold text-steel-dark">Add Team Member</h1>
  </div>

  {% if error %}
  <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 mb-4 text-sm">{{ error }}</div>
  {% endif %}

  <div class="bg-white rounded-xl shadow p-6">
    <form method="POST" action="/users/new" class="space-y-4">

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First Name <span class="text-red-500">*</span></label>
          <input type="text" name="first_name" required value="{{ form.first_name if form else '' }}"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
          <input type="text" name="last_name" value="{{ form.last_name if form else '' }}"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none"/>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Employee ID <span class="text-red-500">*</span></label>
          <input type="text" name="employee_id" required value="{{ form.employee_id if form else suggested_id }}"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-steel-mid focus:outline-none"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Role <span class="text-red-500">*</span></label>
          <select name="role" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none">
            {% for r in roles %}
            <option value="{{ r.value }}" {% if form and form.role == r.value %}selected{% endif %}>
              {{ r.value.replace('_',' ').title() }}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" value="{{ form.email if form else '' }}" placeholder="Optional — used for login"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none"/>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
        <input type="password" name="password" required minlength="6" placeholder="Min 6 characters"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-steel-mid focus:outline-none"/>
        <p class="text-xs text-gray-400 mt-1">They can log in with their Employee ID or email + this password.</p>
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" name="mobile_access" value="1" id="mobile_access" class="rounded border-gray-300"/>
        <label for="mobile_access" class="text-sm text-gray-700">Mobile access</label>
      </div>

      <div class="flex justify-end gap-3 pt-2 border-t border-gray-100">
        <a href="/users" class="px-5 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm hover:bg-gray-50 transition">Cancel</a>
        <button type="submit" class="bg-steel-dark hover:bg-steel-mid text-white text-sm font-medium px-6 py-2 rounded-lg transition">Create User</button>
      </div>

    </form>
  </div>
</div>

{% endblock %}

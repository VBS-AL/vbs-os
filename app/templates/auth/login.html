{% extends "base.html" %}
{% block title %}Sign In — Van Buren Steel{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-6">
  <div class="bg-white rounded-xl shadow-lg p-10 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-steel-dark">VAN BUREN STEEL</h1>
      <p class="text-gray-500 text-sm mt-1">Operating System</p>
    </div>
    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4 text-sm">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/auth/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Employee ID or Email</label>
        <input name="username" type="text" required autofocus
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input name="password" type="password" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-steel-mid"/>
      </div>
      <button type="submit"
        class="w-full bg-steel-dark hover:bg-steel-mid text-white font-medium py-2 rounded-lg transition text-sm">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
